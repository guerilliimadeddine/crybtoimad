name: Crypto Price Alert Bot

on:
  schedule:
    - cron: '*/10 * * * *' # يعمل تلقائياً كل 10-15 دقيقة
  workflow_dispatch: # يتيح لك التشغيل اليدوي بضغط زر

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Restore/Save Price Cache
        uses: actions/cache@v4
        with:
          path: prices_cache.json
          key: crypto-price-cache-${{ github.run_id }}
          restore-keys: |
            crypto-price-cache-

      - name: Run script
        run: python bot.py
