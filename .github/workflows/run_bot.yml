name: Crypto Price Alert Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write # إعطاء صلاحيات الكتابة لتعديل الملف

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python bot.py

      - name: Commit and push price cache
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update price cache [skip ci]"
          file_pattern: "prices_cache.json"
