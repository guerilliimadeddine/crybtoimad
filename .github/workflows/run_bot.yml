name: Run Crypto Bot

on:
  schedule:
    - cron: '*/10 * * * *' # يعمل تلقائياً كل 10 دقائق
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى شئت للتجربة

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # مهم جداً للسماح للسكربت بتحديث ملف الأسعار تلقائياً

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python bot.py

      - name: Commit and push updated prices
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update prices.json automatically'
          file_pattern: prices.json
