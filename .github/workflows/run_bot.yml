name: Crypto Price Alert Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Restore cached prices
        uses: actions/cache@v4
        with:
          path: prices_cache.json
          key: crypto-cache-${{ github.run_number }}
          restore-keys: |
            crypto-cache-

      - name: Run script
        run: python bot.py

      - name: Save prices cache
        uses: actions/cache@v4
        with:
          path: prices_cache.json
          key: crypto-cache-${{ github.run_number }}
